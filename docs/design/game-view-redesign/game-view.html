<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game view</title>
</head>
<body>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1B1918}
button{font-family:inherit}
</style>
<div style="width:390px;height:1640px;box-sizing:border-box;background:#FAF6F1;display:flex;flex-direction:column">

  <!-- Header -->
  <div style="background:#0D47A1;color:#fff;padding:20px 16px 18px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <div style="font-size:20px;font-weight:700;line-height:1.2">Sunday Smash Doubles</div>
    </div>
    <div style="display:flex;gap:8px;padding-left:32px">
      <span style="background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Badminton</span>
      <span style="background:#E8F5E9;color:#166534;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700">Active</span>
      <span style="background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Intermediate</span>
    </div>
  </div>

  <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">

    <!-- DETAILS -->
    <div style="background:#fff;border:1px solid #E8E4DF;border-radius:14px;padding:4px 14px">
      <div style="display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #EFECE6">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div style="font-size:15px">Sat 24 Oct · 7:00 – 9:00 PM</div>
      </div>
      <!-- Venue: plain tappable row, no box -->
      <button style="all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #EFECE6">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <div style="flex:1;font-size:15px;color:#1565C0;font-weight:600">Our Tampines Hub · Hall 2</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6D6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <!-- Invite type -->
      <button style="all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #EFECE6">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52514F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 20v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg>
        <div style="font-size:13px;color:#6E6D6B;width:78px">Invite type</div>
        <div style="flex:1;font-size:15px;color:#1565C0;font-weight:600">Groups (2) · Players (3)</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6D6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <!-- Organizer -->
      <button style="all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px">
        <div style="width:32px;height:32px;border-radius:50%;background:#DBEAFE;color:#1E40AF;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">PK</div>
        <div style="font-size:13px;color:#6E6D6B;width:78px">Organizer</div>
        <div style="flex:1;font-size:15px;font-weight:600">Pratheesh <span style="color:#6E6D6B;font-weight:400">(Prath)</span></div>
      </button>
    </div>

    <!-- RESPONSES (replaces Players block) -->
    <div style="background:#fff;border:1px solid #E8E4DF;border-radius:14px;padding:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:17px;font-weight:700">Responses</div>
        <div style="font-size:14px;font-weight:700;color:#166534">5 of 8 joined</div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin:10px 0 4px"><span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#52514F;text-transform:uppercase">Accepted</span><span style="background:#E8F5E9;color:#166534;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700">5</span></div>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#DBEAFE;color:#1E40AF;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">PK</span><span style="flex:1;font-size:15px">Pratheesh <span style="color:#6E6D6B">(Prath)</span></span><span style="background:#FEF3C7;color:#78350F;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700">Organizer</span></button>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#D1FAE5;color:#065F46;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">AR</span><span style="flex:1;font-size:15px">Arun Raj <span style="color:#6E6D6B">(Arun)</span></span></button>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#FCE7F3;color:#9D174D;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">LT</span><span style="flex:1;font-size:15px">Li Ting <span style="color:#6E6D6B">(Ting)</span></span></button>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#EDE9FE;color:#5B21B6;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">MS</span><span style="flex:1;font-size:15px">Mohan S <span style="color:#6E6D6B">(Mo)</span></span></button>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#FEF3C7;color:#92400E;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">KD</span><span style="flex:1;font-size:15px">Kavya D <span style="color:#6E6D6B">(Kav)</span></span><span style="background:#FFF3E0;color:#1B1918;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700">Waitlisted</span></button>

      <!-- Declined ABOVE Pending -->
      <div style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;border-top:1px solid #EFECE6;padding-top:12px"><span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#52514F;text-transform:uppercase">Declined</span><span style="background:#FFEBEE;color:#C62828;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700">1</span></div>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#DBEAFE;color:#1E40AF;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">RN</span><span style="flex:1;font-size:15px">Ravi N <span style="color:#6E6D6B">(Ravi)</span></span><span style="font-size:12px;color:#6E6D6B">via invitation</span></button>

      <div style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;border-top:1px solid #EFECE6;padding-top:12px"><span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#52514F;text-transform:uppercase">Pending</span><span style="background:#EFECE6;color:#52514F;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700">2</span></div>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#D1FAE5;color:#065F46;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">SJ</span><span style="flex:1;font-size:15px">Sam J <span style="color:#6E6D6B">(Sam)</span></span></button>
      <button style="all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><span style="width:32px;height:32px;border-radius:50%;background:#EFECE6;color:#52514F;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">@</span><span style="flex:1;font-size:15px;color:#52514F">friend@example.com</span><span style="font-size:12px;color:#6E6D6B">email invite</span></button>
    </div>

    <!-- INVITE (below Responses) -->
    <div style="background:#fff;border:1px solid #E8E4DF;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:17px;font-weight:700">Invite</div>
      <div style="font-size:13px;color:#6E6D6B">Pick several groups or players, then send once.</div>
      <button style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid #E8E4DF;border-radius:12px;padding:0 12px"><span style="width:28px;height:28px;border-radius:50%;background:#E3F2FD;color:#1565C0;font-size:20px;line-height:28px;text-align:center;font-weight:700">+</span><span style="flex:1;font-size:15px;font-weight:600">Invite groups</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6D6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid #E8E4DF;border-radius:12px;padding:0 12px"><span style="width:28px;height:28px;border-radius:50%;background:#E3F2FD;color:#1565C0;font-size:20px;line-height:28px;text-align:center;font-weight:700">+</span><span style="flex:1;font-size:15px;font-weight:600">Invite players</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6D6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <!-- CLOSE GAME (last) -->
    <div style="background:#fff;border:1px solid #E8E4DF;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:17px;font-weight:700">Close game</div>
      <div style="font-size:13px;color:#52514F;line-height:1.4">Opens after the end time (Sat 24 Oct, 9:00 PM). Confirm who played, then pick winner and runner-up.</div>
      <button disabled style="min-height:48px;border:0;border-radius:12px;background:#EFECE6;color:#6E6D6B;font-size:15px;font-weight:700">Close game · available after 9:00 PM</button>
    </div>
  </div>
</div>
</body>
</html>
